# Optional local identity provider for OAuth and token exchange: Keycloak with a demo realm.
# Dev only: fixed secrets and a password grant. See docs/auth.md.
name: mcp-auth

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:723b1d6e254c0fc96d5cffec860c7e0744d6a3277822b865bb538cf891575e41
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-dev-password
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      # Read by the realm import, so tokens carry the MCP server URL as their audience (RFC 8707).
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:3000/mcp}
    volumes:
      - ./keycloak/mcp-realm.json:/opt/keycloak/data/import/mcp-realm.json:ro
    ports:
      - 127.0.0.1:${KEYCLOAK_PORT:-8080}:8080
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"
      interval: 3s
      timeout: 3s
      retries: 60
