schema: 1
requires:
  - name: docker
  - name: node
    version: 26.0.0
  - name: pnpm
    version: 12.0.0
prompts:
  - name: name
    message: Package name, in kebab-case
    pattern: ^[a-z][a-z0-9-]{0,49}$
    default: "{{dir}}"
  - name: owner
    message: GitHub owner, for README links, code owners, and the MCP Registry name
    pattern: ^[A-Za-z0-9-]{1,39}$
    optional: true
replace:
  - from: '"extends": ["config:recommended", "github>opikdev/starters//renovate/baseline"]'
    to: '"extends": ["config:recommended"]'
    files: [renovate.json]
  - from: "## Start your own project\n\nCreate a renamed copy with [pik](https://github.com/opikdev/pik). It downloads this starter's latest release, then sets your project name and GitHub owner:\n\n```sh\npik new mcp-server-ts-starter my-mcp-server\n```\n\nOr select **Use this template** on GitHub. That copy keeps the name `mcp-server-ts-starter` and the owner `opikdev`, so follow `pik.yaml` by hand: swap the `replace` text, delete the `exclude` paths, and run the `setup` commands.\n\n## Usage\n"
    to: "## Usage\n"
    files: [README.md]
  - from: "opikdev/mcp-server-ts-starter\ncd mcp-server-ts-starter\n"
    to: "{{owner}}/{{name}}\ncd {{name}}\n"
    files: [README.md]
  - from: opikdev/mcp-server-ts-starter
    to: "{{owner}}/{{name}}"
    files: [README.md, server.json, package.json, Dockerfile]
  - from: "@opikdev"
    to: "@{{owner}}"
    files: [.github/CODEOWNERS]
  - from: '"mcp-server-ts-starter"'
    to: '"{{name}}"'
    files: [package.json, server.json]
  - from: mcp-server-ts-starter
    to: "{{name}}"
    files:
      - compose.yaml
      - test/e2e/package.test.ts
      - test/e2e/docker.test.ts
      - test/e2e/keycloak.test.ts
      - test/e2e/upstream.test.ts
      - docs/clients.md
      - .devcontainer/devcontainer.json
exclude:
  - .baseline.sha256
  - .github/workflows/baseline-check.yml
setup:
  - pnpm install
  - pnpm exec biome format --write .
next:
  - pnpm inspect
check:
  - pnpm verify
  - pnpm test:e2e
